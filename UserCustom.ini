مرحباً Claude. بصفتنا شركاء في تطوير هذا التطبيق، أريد الآن تحويله إلى تطبيق احترافي (Production-Ready) ينافس أقوى التطبيقات المنشورة. المطلب هو بناء نظام إدارة ملفات هجين (Hybrid File Engine) ذكي جداً وقوي.
أريدك أن تطور الكود ليتضمن المميزات التالية بدقة:
1. نظام التشخيص عند التشغيل (Initialization & Diagnostics):
عند تشغيل التطبيق (onCreate)، قم فوراً بجلب إصدار الأندرويد وعرضه للمستخدم بشكل أنيق.
منطق Shizuku الذكي: إذا كان الجهاز Android 11+، افحص حالة Shizuku:
إذا لم يكن مثبتاً/مشغلاً: اطلب من المستخدم تفعيله مع توضيح أن هذا "إجباري" للوصول لملفات اللعبة.
إذا كان مشغلاً: اطلب صلاحية requestPermission وتأكد من توجيه المستخدم لاختيار 'Allow all the time' (السماح دائماً). لا تسمح بالبدء إلا بعد منح الصلاحية.
إذا كان الجهاز Android 10 أو أقل: تخطى Shizuku واطلب صلاحيات التخزين التقليدية.
2. المحرك الهجين لنقل الملفات (Universal File Mover):
قم بإنشاء دالة موحدة للنقل تتعرف تلقائياً على المسار الصحيح:
في Android 11+: استخدم أوامر sh عبر Shizuku لتنفيذ cp -rf و chmod 777 لضمان استقرار الملفات داخل مجلدات الداتا المقفلة.
في Android 10-: استخدم مكتبات java.io العادية.
الأمان: قبل النقل، تأكد من إنشاء المجلدات الوجهة (Destination) إذا لم تكن موجودة باستخدام أمر mkdir -p.
3. منطق التحميل والتحقق (Download & Verify):
تجنب التحميل المباشر للمجلدات الحساسة؛ قم بالتحميل دائماً إلى context.getCacheDir().
إذا كان الملف المحمل مضغوطاً (.zip)، قم بفك ضغطه برمجياً مع إظهار Progress Bar (شريط تقدم) حقيقي وليس مجرد دوران وهمي.
بعد النقل، قم بعمل Verify (تحقق) من وجود الملف في المسار النهائي، وإذا وُجد، قم بتغيير لون الزر (Toggle) إلى الأخضر كدليل على النجاح.
4. تحسين تجربة المستخدم (UX UI):
في setupListeners أضف فحصاً أخيراً: "هل اللعبة مغلقة؟". (اختياري: نبه المستخدم أن إغلاق اللعبة قبل التفعيل يضمن نجاح العملية).
اجعل التطبيق يتذكر الحالة (State Management)؛ فإذا قام المستخدم بتفعيل الـ 90FPS وخرج من التطبيق وعاد، يجب أن يجد الزر مفعلاً (استخدم SharedPreferences).
5. معالجة الأخطاء (Global Error Handler):
أريد "كوداً نظيفاً" يحتوي على Try-Catch لكل عملية، مع رسائل Toast مخصصة (مثلاً: "خطأ في الاتصال"، "Shizuku فقد الصلاحية"، "المساحة غير كافية").
أريدك أن تبهرني بكود Java نظيف، مقسم إلى Classes أو Functions مرتبة، لنجعل هذا التطبيق هو الأفضل في فئته.